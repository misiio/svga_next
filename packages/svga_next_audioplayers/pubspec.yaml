name: svga_next_audioplayers
description: Audio backend for the svga_next Flutter SVGA player using audioplayers, with playback controls and automatic temporary file cleanup.
version: 0.1.0
repository: https://github.com/misiio/svga_next

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  svga_next: ^0.1.0

dev_dependencies:
  audioplayers_platform_interface: ^7.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
